<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>ספרא - התחברות</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 36px 40px;
      width: 380px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    h2 { color: #3d2b1f; margin-bottom: 24px; text-align: center; font-size: 1.6em; }
    label { display: block; color: #3d2b1f; font-weight: bold; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #2a6fad;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:hover { background: #1d5a91; }
    .error { color: red; text-align: center; margin-bottom: 12px; font-size: 14px; }
    .success { color: green; text-align: center; margin-bottom: 12px; font-size: 14px; }
    .link { text-align: center; margin-top: 14px; color: #555; font-size: 14px; }
    .link a { color: #2a6fad; text-decoration: none; }
    .forgot { text-align: left; margin-top: -10px; margin-bottom: 14px; }
    .forgot a { color: #888; font-size: 13px; text-decoration: none; }
    .forgot a:hover { color: #2a6fad; }
  </style>
</head>
<body>
  <div class="card">
    <h2>התחברות לספרא</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if success %}<p class="success">{{ success }}</p>{% endif %}
    <form method="POST" action="/login">
      <label>שם משתמש</label>
      <input type="text" name="username" required placeholder="שם פרטי + שם משפחה">
      <label>סיסמה</label>
      <input type="password" name="password" required placeholder="סיסמה">
      <div class="forgot"><a href="/forgot">שכחת שם משתמש או סיסמה?</a></div>
      <button type="submit" class="btn">התחברות</button>
    </form>
    <div class="link">עדיין לא רשום? <a href="/register">הרשמה</a></div>
  </div>
</body>
</html>
