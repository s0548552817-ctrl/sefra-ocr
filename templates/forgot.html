<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>ספרא - שחזור פרטים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #d4b896;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      direction: rtl;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 36px 40px;
      width: 400px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    h2 { color: #3d2b1f; margin-bottom: 10px; text-align: center; font-size: 1.5em; }
    .subtitle { color: #666; text-align: center; font-size: 14px; margin-bottom: 24px; }
    label { display: block; color: #3d2b1f; font-weight: bold; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #2a6fad;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #1d5a91; }
    .error { color: red; text-align: center; margin-bottom: 12px; font-size: 14px; }
    .result-box {
      background: #f0f8e8;
      border: 1px solid #34a853;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 15px;
      color: #1f5c2e;
      line-height: 1.8;
    }
    .link { text-align: center; margin-top: 14px; color: #555; font-size: 14px; }
    .link a { color: #2a6fad; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>שחזור פרטי כניסה</h2>
    <p class="subtitle">הזן את מספר הטלפון שהזנת בעת ההרשמה</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    {% if result %}
      <div class="result-box">{{ result | safe }}</div>
      <a href="/login" class="btn" style="display:block; text-align:center; text-decoration:none;">חזרה להתחברות</a>
    {% else %}
      <form method="POST" action="/forgot">
        <label>מספר טלפון</label>
        <input type="text" name="phone" required placeholder="05X-XXXXXXX">
        <button type="submit" class="btn">אמת ושחזר</button>
      </form>
    {% endif %}

    <div class="link"><a href="/login">חזרה להתחברות</a></div>
  </div>
</body>
</html>
